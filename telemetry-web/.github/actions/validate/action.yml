name: Validate telemetry
description: Build, vet, format-check, and unit-test the telemetry-web module and its adapters

# Linting is a separate matrix job in the calling workflow, so this action takes
# no golangci-lint input.

runs:
  using: composite
  steps:
    - name: Set up Go (telemetry toolchain)
      uses: actions/setup-go@v6
      with:
        go-version-file: telemetry-web/go.mod
        cache-dependency-path: |
          telemetry-web/go.sum
          telemetry-web/adapters/*/go.sum

    - name: Check formatting
      shell: bash
      working-directory: telemetry-web
      run: |
        unformatted=$(gofmt -l .)
        if [ -n "$unformatted" ]; then
          echo "::error::gofmt needed on:"; echo "$unformatted"; exit 1
        fi

    # The core resolves nothing from this repo, so GOWORK=off is both meaningful
    # and satisfiable here: it is exactly what a consumer sees.
    - name: Check go.mod tidiness (core)
      shell: bash
      working-directory: telemetry-web
      env:
        GOWORK: "off"
      run: go mod tidy -diff

    # No tidy check for the adapters here. go mod tidy ignores go.work by design, so
    # it always resolves their imports against the PINNED core — and a PR that adds
    # or moves a core package cannot satisfy a pin that predates it. Unsatisfiable
    # pre-merge, exactly like the GOWORK=off build; both are release-time steps in
    # docs/releasing.md.

    # go.work makes these resolve the in-tree core, so a breaking core change
    # fails here instead of after it is published.
    - name: Build and vet
      shell: bash
      working-directory: telemetry-web
      run: |
        for mod in . adapters/gin adapters/echo adapters/chi; do
          echo "--- build $mod"
          (cd "$mod" && go build ./... && go vet ./...)
        done

    - name: Unit tests
      shell: bash
      working-directory: telemetry-web
      run: |
        for mod in . adapters/gin adapters/echo adapters/chi; do
          echo "--- test $mod"
          (cd "$mod" && go test -race -count=1 -shuffle=on ./...)
        done

    # Deliberately NOT a GOWORK=off build of the adapters against their pinned
    # core. That check cannot pass on a PR that changes the core API, because the
    # pin has to name a commit that only exists once the PR is merged.

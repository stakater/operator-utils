name: Validate telemetry
description: Build, vet, format-check, and unit-test the telemetry-web module and its adapters

# Linting is a separate matrix job in the calling workflow, so this action takes
# no golangci-lint input.

runs:
  using: composite
  steps:
    - name: Set up Go (telemetry toolchain)
      uses: actions/setup-go@v6
      with:
        go-version-file: telemetry-web/go.mod
        cache-dependency-path: |
          telemetry-web/go.sum
          telemetry-web/adapters/*/go.sum

    - name: Check formatting
      shell: bash
      working-directory: telemetry-web
      run: |
        unformatted=$(gofmt -l .)
        if [ -n "$unformatted" ]; then
          echo "::error::gofmt needed on:"; echo "$unformatted"; exit 1
        fi

    - name: Check go.mod tidiness
      shell: bash
      working-directory: telemetry-web
      env:
        GOWORK: "off"
      run: |
        for mod in . adapters/gin adapters/echo adapters/chi; do
          echo "--- tidy check $mod"
          (cd "$mod" && go mod tidy -diff)
        done

    # go.work makes these resolve the in-tree core, so a breaking core change
    # fails here instead of after it is published.
    - name: Build and vet
      shell: bash
      working-directory: telemetry-web
      run: |
        for mod in . adapters/gin adapters/echo adapters/chi; do
          echo "--- build $mod"
          (cd "$mod" && go build ./... && go vet ./...)
        done

    - name: Unit tests
      shell: bash
      working-directory: telemetry-web
      run: |
        for mod in . adapters/gin adapters/echo adapters/chi; do
          echo "--- test $mod"
          (cd "$mod" && go test -race -count=1 -shuffle=on ./...)
        done

    # Deliberately NOT a GOWORK=off build of the adapters against their pinned
    # core. That check cannot pass on a PR that changes the core API, because the
    # pin has to name a commit that only exists once the PR is merged. A gate that
    # is red on every such PR teaches people to ignore gates, so it lives in the
    # release workflow instead, where it can be satisfied. See
    # docs/releasing.md.
    #
    # On a PR the workspace build above is the real signal: it compiles the
    # adapters against the in-tree core, so a breaking core change fails here.
